name: Financial model checks
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-cost-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python src/download_sample.py --directory .cache/source
      - run: python src/build_data.py --source .cache/source/EA-Cost-FOCUS_1.0.csv
      - run: python src/build_powerbi.py
      - run: python -m unittest discover -s tests -v
